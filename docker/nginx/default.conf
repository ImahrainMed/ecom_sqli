server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;

        # /chatbot/message can wait on a local Ollama call whose first
        # (uncached) response can take ~3 minutes — the system prompt + full
        # tool schema is ~2.7k tokens, and CPU prompt evaluation dominates
        # that time (see ChatbotService::OLLAMA_TIMEOUT_SECONDS). The default
        # 60s here caused real 504s in testing well before PHP's own
        # generous HTTP client timeout ever got a chance to return a proper
        # error message.
        fastcgi_read_timeout 220s;
        fastcgi_send_timeout 220s;
    }

    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 64M;

    error_log /var/log/nginx/symfony_error.log;
    access_log /var/log/nginx/symfony_access.log;
}
