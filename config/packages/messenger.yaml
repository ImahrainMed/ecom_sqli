framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Sent synchronously (not routed to "async"): this project has no
            # messenger consumer worker running anywhere (checked docker-compose.yaml
            # — no such service), so routing mailer messages to "async" meant they
            # were queued in `messenger_messages` and never actually delivered.
            # Order confirmation emails (SQLIE-19) need to be sent right after
            # checkout, so this has to happen in-process.
            # Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
